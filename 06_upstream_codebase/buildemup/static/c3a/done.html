<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>BuildemUp — Done</title>
    <link rel="stylesheet" href="/c3a/_shared.css">
</head>
<body>
<main>
    <h1>Case resolved</h1>
    <p data-c3a-loading class="c3a-loading">Verifying state…</p>
    <div id="done-container" class="c3a-hidden">
        <div class="c3a-card">
            <p class="c3a-success" id="success-line">
                Your case has been resolved.
            </p>
            <p>Terminal state: <strong id="terminal-label"></strong></p>
            <p><a href="/brief_form.html">Start a new brief</a></p>
        </div>
    </div>
    <div id="error-container"></div>
</main>
<script src="/c3a/_shared.js"></script>
<script src="/c3a/done.js"></script>
</body>
</html>
